name: macos-runner-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Print runner
        run: |
          uname -a
          sw_vers
