name: build-ergouzi-ide-installers

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Product version used in artifact names (for example 0.0.4); leave blank for a dev build version
        required: false
        type: string
      opencode_repository:
        description: Repository that provides the OpenCode runtime source
        required: false
        default: xxloocee/opencode-private
      opencode_ref:
        description: Git ref of the OpenCode runtime repository
        required: false
        default: main
      target_platform:
        description: Platform to build
        required: false
        default: all
        type: choice
        options:
          - darwin
          - windows
          - linux
          - all
  push:
    tags:
      - "ergouzi-ide-v*.*.*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      opencode_ref: ${{ steps.opencode-source.outputs.ref }}
      opencode_sha: ${{ steps.opencode-revision.outputs.sha }}

    env:
      OPENCODE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.opencode_repository || 'xxloocee/opencode-private' }}
      OPENCODE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.opencode_ref || 'main' }}

    steps:
      - name: Select build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          target_platform="${{ github.event_name == 'workflow_dispatch' && inputs.target_platform || 'all' }}"

          case "$target_platform" in
            darwin)
              matrix='{"include":[{"runner":"macos-15-intel","platform":"darwin","arch":"x64","policy_target":"darwin"},{"runner":"macos-14","platform":"darwin","arch":"arm64","policy_target":"darwin"}]}'
              ;;
            windows)
              matrix='{"include":[{"runner":"windows-2022","platform":"win32","arch":"x64","policy_target":"win32"},{"runner":"windows-11-arm","platform":"win32","arch":"arm64","policy_target":"win32"}]}'
              ;;
            linux)
              matrix='{"include":[{"runner":"ubuntu-24.04","platform":"linux","arch":"x64","policy_target":"linux"},{"runner":"ubuntu-24.04-arm","platform":"linux","arch":"arm64","policy_target":"linux"}]}'
              ;;
            all)
              matrix='{"include":[{"runner":"macos-15-intel","platform":"darwin","arch":"x64","policy_target":"darwin"},{"runner":"macos-14","platform":"darwin","arch":"arm64","policy_target":"darwin"},{"runner":"windows-2022","platform":"win32","arch":"x64","policy_target":"win32"},{"runner":"windows-11-arm","platform":"win32","arch":"arm64","policy_target":"win32"},{"runner":"ubuntu-24.04","platform":"linux","arch":"x64","policy_target":"linux"},{"runner":"ubuntu-24.04-arm","platform":"linux","arch":"arm64","policy_target":"linux"}]}'
              ;;
            *)
              echo "Unsupported target_platform: $target_platform" >&2
              exit 1
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Checkout Ergouzi IDE release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select OpenCode runtime ref
        id: opencode-source
        shell: bash
        env:
          REQUESTED_OPENCODE_REF: ${{ env.OPENCODE_REF }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/ergouzi-ide-v* ]]; then
            ref="$(tr -d '\r\n' < .github/opencode-runtime-ref)"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo ".github/opencode-runtime-ref must contain one full OpenCode commit SHA for tag releases." >&2
              exit 1
            fi
          else
            ref="$REQUESTED_OPENCODE_REF"
            if [[ ! "$ref" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ ]]; then
              echo "Invalid OpenCode ref: $ref" >&2
              exit 1
            fi
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout OpenCode runtime source for revision resolution
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENCODE_REPOSITORY }}
          ref: ${{ steps.opencode-source.outputs.ref }}
          path: opencode-source
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.CROSS_REPO_GH_TOKEN || secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Validate OpenCode runtime dependency contract
        run: node tools/validate-opencode-runtime.mjs --root=opencode-source

      - name: Resolve OpenCode runtime revision
        id: opencode-revision
        shell: bash
        run: echo "sha=$(git -C opencode-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}

    env:
      OPENCODE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.opencode_repository || 'xxloocee/opencode-private' }}
      OPENCODE_REF: ${{ needs.plan.outputs.opencode_ref }}
      ERGOUZI_IDE_OPENCODE_SOURCE_DIR: ${{ github.workspace }}/opencode-source

    steps:
      - name: Checkout Ergouzi IDE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        shell: bash
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/ergouzi-ide-v* ]]; then
            release_version="${GITHUB_REF_NAME#ergouzi-ide-v}"
          else
            release_version="$INPUT_RELEASE_VERSION"
            if [[ -z "$release_version" ]]; then
              release_version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            fi
          fi

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Ergouzi IDE release version: $release_version" >&2
            exit 1
          fi

          echo "ERGOUZI_IDE_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Checkout OpenCode runtime source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENCODE_REPOSITORY }}
          ref: ${{ needs.plan.outputs.opencode_sha }}
          path: opencode-source
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CROSS_REPO_GH_TOKEN || secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
          df -h

      - name: Get OpenCode Bun baseline download URL
        id: opencode-bun-url
        shell: bash
        run: |
          if [ "$RUNNER_ARCH" = "X64" ]; then
            V=$(node -p "require('./opencode-source/package.json').packageManager.split('@')[1]")
            case "$RUNNER_OS" in
              macOS)   OS=darwin ;;
              Linux)   OS=linux ;;
              Windows) OS=windows ;;
            esac
            echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun for OpenCode source
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ !steps.opencode-bun-url.outputs.url && 'opencode-source/package.json' || '' }}
          bun-download-url: ${{ steps.opencode-bun-url.outputs.url }}

      - name: Get OpenCode Bun cache directory
        id: opencode-bun-cache-dir
        shell: bash
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Restore OpenCode Bun dependencies
        id: opencode-bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.opencode-bun-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-opencode-bun-${{ hashFiles('opencode-source/**/bun.lock') }}

      - name: Install OpenCode Python compatibility dependencies
        shell: bash
        run: python3 -m pip install setuptools || python -m pip install setuptools || pip install setuptools || true

      - name: Install OpenCode dependencies
        shell: bash
        working-directory: opencode-source
        run: bun install

      - name: Save OpenCode Bun dependencies
        if: steps.opencode-bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.opencode-bun-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-opencode-bun-${{ hashFiles('opencode-source/**/bun.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fakeroot libkrb5-dev libx11-dev libxkbfile-dev pkg-config rpm

      - name: Install Ergouzi IDE dependencies
        shell: bash
        env:
          OPENCODE_CLEAN_RELEASE_SKIP_COPILOT_INSTALL: "1"
        run: npm ci

      - name: Sanitize Ergouzi IDE release tree
        shell: bash
        run: |
          set -euo pipefail
          node tools/sanitize/sanitize.test.mjs
          node tools/sanitize/apply.mjs --profile=clean-full
          node tools/sanitize/verify.mjs --profile=clean-full

      - name: Generate platform policies
        shell: bash
        run: |
          set -euo pipefail
          npm run copy-policy-dto --prefix build
          node build/lib/policies/policyGenerator.ts build/lib/policies/policyData.jsonc ${{ matrix.policy_target }}

      - name: Build Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Add-WindowsSdkToolsToPath {
            $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\(x64|arm64)\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) {
              throw "signtool.exe was not found under $sdkRoot"
            }
            $env:PATH = "$($signtool.DirectoryName);$env:PATH"
            Write-Host "Using signtool from $($signtool.FullName)"
          }

          function Invoke-NativeStep {
            param([string[]] $Command)
            & $Command[0] $Command[1..($Command.Length - 1)]
            if ($LASTEXITCODE -ne 0) {
              throw "Command failed with exit code ${LASTEXITCODE}: $($Command -join ' ')"
            }
          }

          Add-WindowsSdkToolsToPath
          Invoke-NativeStep @("npm", "run", "gulp", "vscode-win32-${{ matrix.arch }}-min")
          Invoke-NativeStep @("npm", "run", "gulp", "vscode-win32-${{ matrix.arch }}-inno-updater")
          Invoke-NativeStep @("npm", "run", "gulp", "vscode-win32-${{ matrix.arch }}-system-setup")
          Invoke-NativeStep @("npm", "run", "gulp", "vscode-win32-${{ matrix.arch }}-user-setup")

          $Version = $env:ERGOUZI_IDE_RELEASE_VERSION
          $ArtifactDir = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Path $ArtifactDir -Force | Out-Null

          $ZipPath = Join-Path $ArtifactDir "ergouzi-ide-win32-${{ matrix.arch }}-$Version.zip"
          if (Test-Path $ZipPath) {
            Remove-Item $ZipPath -Force
          }
          Invoke-NativeStep @("7z", "a", "-tzip", $ZipPath, "..\VSCode-win32-${{ matrix.arch }}\*", "-xr!CodeSignSummary*.md")

          Copy-Item ".build\win32-${{ matrix.arch }}\system-setup\VSCodeSetup.exe" (Join-Path $ArtifactDir "ergouzi-ide-setup-${{ matrix.arch }}-$Version.exe")
          Copy-Item ".build\win32-${{ matrix.arch }}\user-setup\VSCodeSetup.exe" (Join-Path $ArtifactDir "ergouzi-ide-user-setup-${{ matrix.arch }}-$Version.exe")

      - name: Build macOS client
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          npm run gulp "vscode-darwin-${{ matrix.arch }}-min"

          version="$ERGOUZI_IDE_RELEASE_VERSION"
          artifact_dir="$PWD/artifacts"
          app_root="../VSCode-darwin-${{ matrix.arch }}"
          app_path="$(find "$app_root" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          test -d "$app_path"

          mkdir -p "$artifact_dir"
          (cd "$app_root" && zip -Xry "$artifact_dir/ergouzi-ide-darwin-${{ matrix.arch }}-$version.zip" .)

          dmg_src="$(mktemp -d)"
          trap 'rm -rf "$dmg_src"' EXIT
          ditto "$app_path" "$dmg_src/$(basename "$app_path")"

          for attempt in 1 2 3; do
            if hdiutil create -volname "Ergouzi IDE" -srcfolder "$dmg_src/$(basename "$app_path")" -ov -format UDZO "$artifact_dir/ergouzi-ide-darwin-${{ matrix.arch }}-$version.dmg"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 5
          done

      - name: Build Linux client
        if: runner.os == 'Linux'
        env:
          VSCODE_LINUX_PACKAGE_STRICT_DEPS: "false"
        shell: bash
        run: |
          set -euo pipefail
          npm run gulp "vscode-linux-${{ matrix.arch }}-min"

          version="$ERGOUZI_IDE_RELEASE_VERSION"
          artifact_dir="$PWD/artifacts"
          mkdir -p "$artifact_dir"

          tar -czf "$artifact_dir/ergouzi-ide-linux-${{ matrix.arch }}-$version.tar.gz" -C .. "VSCode-linux-${{ matrix.arch }}"

          npm run gulp "vscode-linux-${{ matrix.arch }}-prepare-deb"
          npm run gulp "vscode-linux-${{ matrix.arch }}-build-deb"
          cp .build/linux/deb/*/deb/*.deb "$artifact_dir/"

          npm run gulp "vscode-linux-${{ matrix.arch }}-prepare-rpm"
          npm run gulp "vscode-linux-${{ matrix.arch }}-build-rpm"
          cp .build/linux/rpm/*/*.rpm "$artifact_dir/"

      - name: Write build metadata
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$PWD/artifacts"
          mkdir -p "$artifact_dir"

          opencode_ide_sha="$(git rev-parse HEAD)"
          opencode_sha="$(git -C "$ERGOUZI_IDE_OPENCODE_SOURCE_DIR" rev-parse HEAD)"

          cat > "$artifact_dir/BUILD_INFO-${{ matrix.platform }}-${{ matrix.arch }}.txt" <<EOF
          workflow=${{ github.workflow }}
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          event=${{ github.event_name }}
          ref=${{ github.ref }}
          ref_name=${{ github.ref_name }}
          release_version=${ERGOUZI_IDE_RELEASE_VERSION}
          opencode_ide_repository=${{ github.repository }}
          opencode_ide_sha=$opencode_ide_sha
          opencode_repository=${OPENCODE_REPOSITORY}
          opencode_ref=${OPENCODE_REF}
          opencode_sha=$opencode_sha
          platform=${{ matrix.platform }}
          arch=${{ matrix.arch }}
          runner=${{ matrix.runner }}
          EOF

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ergouzi-ide-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*

  release:
    needs: [plan, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ergouzi-ide-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"

          case "$status" in
            404) ;;
            200)
              echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable release assets." >&2
              exit 1
              ;;
            *)
              echo "Unable to verify whether release $GITHUB_REF_NAME exists (HTTP $status)." >&2
              exit 1
              ;;
          esac

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Select release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob

          release_assets=(
            dist/ergouzi-ide-setup-*.exe
            dist/ergouzi-ide-user-setup-*.exe
            dist/ergouzi-ide-darwin-*.dmg
            dist/*.deb
            dist/*.rpm
          )

          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No installer release assets were found." >&2
            exit 1
          fi

          cp "${release_assets[@]}" release-assets/

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > ../dist/SHA256SUMS.txt

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          {
            echo "## Build provenance"
            echo
            echo "- Ergouzi IDE repository: ${{ github.repository }}"
            echo "- Ergouzi IDE ref: ${{ github.ref }}"
            echo "- Ergouzi IDE commit: ${{ github.sha }}"
            echo "- OpenCode runtime repository: xxloocee/opencode-private"
            echo "- OpenCode runtime ref: ${{ needs.plan.outputs.opencode_ref }}"
            echo "- OpenCode runtime commit: ${{ needs.plan.outputs.opencode_sha }}"
            echo
            echo "## Platform builds"
            echo
            for file in BUILD_INFO-*.txt; do
              echo "### ${file#BUILD_INFO-}"
              echo
              echo '```text'
              cat "$file"
              echo '```'
              echo
            done
            echo "## Checksums"
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } > RELEASE_NOTES.md

      - name: Resolve release title
        id: release-meta
        shell: bash
        run: echo "title=Ergouzi IDE ${GITHUB_REF_NAME#ergouzi-ide-v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ steps.release-meta.outputs.title }}
          files: |
            release-assets/*
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
