name: build-quantcode-installers

on:
  workflow_dispatch:
    inputs:
      opencode_repository:
        description: Repository that provides the OpenCode runtime source
        required: false
        default: xxloocee/opencode-private
      opencode_ref:
        description: Git ref of the OpenCode runtime repository
        required: false
        default: main
  push:
    tags:
      - "quantcode-v*.*.*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            policy_target: darwin
          - runner: macos-14
            platform: darwin
            arch: arm64
            policy_target: darwin

    runs-on: ${{ matrix.runner }}

    env:
      OPENCODE_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.opencode_repository || format('{0}/opencode-gui', github.repository_owner) }}
      OPENCODE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.opencode_ref || 'main' }}
      QUANTCODE_OPENCODE_SOURCE_DIR: ${{ github.workspace }}/opencode-source

    steps:
      - name: Checkout QuantCode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout OpenCode runtime source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENCODE_REPOSITORY }}
          ref: ${{ env.OPENCODE_REF }}
          path: opencode-source
          fetch-depth: 0
          token: ${{ secrets.CROSS_REPO_GH_TOKEN || secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Get OpenCode Bun baseline download URL
        id: opencode-bun-url
        shell: bash
        run: |
          if [ "$RUNNER_ARCH" = "X64" ]; then
            V=$(node -p "require('./opencode-source/package.json').packageManager.split('@')[1]")
            case "$RUNNER_OS" in
              macOS)   OS=darwin ;;
              Linux)   OS=linux ;;
              Windows) OS=windows ;;
            esac
            echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun for OpenCode source
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ !steps.opencode-bun-url.outputs.url && 'opencode-source/package.json' || '' }}
          bun-download-url: ${{ steps.opencode-bun-url.outputs.url }}

      - name: Get OpenCode Bun cache directory
        id: opencode-bun-cache-dir
        shell: bash
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Restore OpenCode Bun dependencies
        id: opencode-bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.opencode-bun-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-opencode-bun-${{ hashFiles('opencode-source/**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-opencode-bun-

      - name: Install OpenCode Python compatibility dependencies
        shell: bash
        run: python3 -m pip install setuptools || pip install setuptools || true

      - name: Install OpenCode dependencies
        shell: bash
        working-directory: opencode-source
        run: bun install

      - name: Save OpenCode Bun dependencies
        if: steps.opencode-bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.opencode-bun-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-opencode-bun-${{ hashFiles('opencode-source/**/bun.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install QuantCode dependencies
        shell: bash
        run: npm ci

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Generate platform policies
        shell: bash
        run: |
          set -euo pipefail
          npm run copy-policy-dto --prefix build
          node build/lib/policies/policyGenerator.ts build/lib/policies/policyData.jsonc ${{ matrix.policy_target }}

      - name: Build Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run gulp "vscode-win32-${{ matrix.arch }}-min-ci"
          npm run gulp "vscode-win32-${{ matrix.arch }}-inno-updater"
          npm run gulp "vscode-win32-${{ matrix.arch }}-system-setup"
          npm run gulp "vscode-win32-${{ matrix.arch }}-user-setup"

          $Version = node -p "require('./package.json').version"
          $ArtifactDir = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Path $ArtifactDir -Force | Out-Null

          $ZipPath = Join-Path $ArtifactDir "QuantCode-win32-${{ matrix.arch }}-$Version.zip"
          if (Test-Path $ZipPath) {
            Remove-Item $ZipPath -Force
          }
          & 7z a -tzip $ZipPath "..\VSCode-win32-${{ matrix.arch }}\*" "-xr!CodeSignSummary*.md"

          Copy-Item ".build\win32-${{ matrix.arch }}\system-setup\VSCodeSetup.exe" (Join-Path $ArtifactDir "QuantCodeSetup-${{ matrix.arch }}-$Version.exe")
          Copy-Item ".build\win32-${{ matrix.arch }}\user-setup\VSCodeSetup.exe" (Join-Path $ArtifactDir "QuantCodeUserSetup-${{ matrix.arch }}-$Version.exe")

      - name: Build macOS client
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          npm run gulp "vscode-darwin-${{ matrix.arch }}-min"

          version=$(node -p "require('./package.json').version")
          artifact_dir="$PWD/artifacts"
          app_root="../VSCode-darwin-${{ matrix.arch }}"
          app_name="$(find "$app_root" -maxdepth 1 -name '*.app' -print -quit | xargs basename)"
          app_path="$app_root/$app_name"

          mkdir -p "$artifact_dir"
          (cd "$app_root" && zip -Xry "$artifact_dir/QuantCode-darwin-${{ matrix.arch }}-$version.zip" .)
          hdiutil create -volname "QuantCode Preview" -srcfolder "$app_path" -ov -format UDZO "$artifact_dir/QuantCode-darwin-${{ matrix.arch }}-$version.dmg"

      - name: Build Linux client
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm run gulp "vscode-linux-${{ matrix.arch }}-min-ci"

          version=$(node -p "require('./package.json').version")
          artifact_dir="$PWD/artifacts"
          mkdir -p "$artifact_dir"

          tar -czf "$artifact_dir/QuantCode-linux-${{ matrix.arch }}-$version.tar.gz" -C .. "VSCode-linux-${{ matrix.arch }}"

          npm run gulp "vscode-linux-${{ matrix.arch }}-prepare-deb"
          npm run gulp "vscode-linux-${{ matrix.arch }}-build-deb"
          cp .build/linux/deb/*/deb/*.deb "$artifact_dir/"

          npm run gulp "vscode-linux-${{ matrix.arch }}-prepare-rpm"
          npm run gulp "vscode-linux-${{ matrix.arch }}-build-rpm"
          cp .build/linux/rpm/*/*.rpm "$artifact_dir/"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantcode-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/quantcode-v')
    runs-on: ubuntu-24.04

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
