name: rebase-main-with-vscode

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebase-main:
    runs-on: ubuntu-24.04

    env:
      TARGET_BRANCH: main
      UPSTREAM_REPOSITORY: https://github.com/microsoft/vscode.git
      UPSTREAM_BRANCH: main
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_EDITOR: true

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.QUANTCODE_SYNC_TOKEN || github.token }}

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Fetch upstream vscode
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH":refs/remotes/upstream/"$UPSTREAM_BRANCH"

      - name: Detect upstream changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha=$(git rev-parse HEAD)
          upstream_ref="refs/remotes/upstream/$UPSTREAM_BRANCH"
          upstream_sha=$(git rev-parse "$upstream_ref")
          merge_base=$(git merge-base HEAD "$upstream_ref")

          echo "current_main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if [ "$merge_base" = "$upstream_sha" ]; then
            echo "needs_rebase=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Upstream Rebase"
              echo
              echo "No new upstream commits detected."
              echo
              echo "- main: \`$current_main_sha\`"
              echo "- upstream/$UPSTREAM_BRANCH: \`$upstream_sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "needs_rebase=true" >> "$GITHUB_OUTPUT"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          {
            echo "## Upstream Rebase"
            echo
            echo "New upstream commits detected. Rebase will start."
            echo
            echo "- main: \`$current_main_sha\`"
            echo "- merge-base: \`$merge_base\`"
            echo "- upstream/$UPSTREAM_BRANCH: \`$upstream_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebase main onto upstream main
        if: steps.detect.outputs.needs_rebase == 'true'
        shell: bash
        run: |
          set -euo pipefail

          upstream_ref="refs/remotes/upstream/$UPSTREAM_BRANCH"
          resolver_script="$RUNNER_TEMP/resolve-product-json-conflict.mjs"
          cp .github/scripts/resolve-product-json-conflict.mjs "$resolver_script"
          git rebase "$upstream_ref" || true

          while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
            conflict_files=$(git diff --name-only --diff-filter=U || true)

            if [ -z "$conflict_files" ]; then
              git rebase --continue || true
              continue
            fi

            if [ "$conflict_files" = "product.json" ]; then
              node "$resolver_script"
              git add product.json
              git rebase --continue || true
              continue
            fi

            {
              echo
              echo "### Rebase Stopped"
              echo
              echo "Automatic brand conflict resolution could not finish this rebase."
              echo
              echo "Conflicting files:"
              printf '%s\n' "$conflict_files" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          done

      - name: Push rebased main
        if: steps.detect.outputs.needs_rebase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          previous_sha="${{ steps.detect.outputs.current_main_sha }}"
          current_sha=$(git rev-parse HEAD)

          if [ "$previous_sha" = "$current_sha" ]; then
            {
              echo
              echo "### Rebase Result"
              echo
              echo "Rebase completed without changing the main branch head."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git push --force-with-lease origin HEAD:"$TARGET_BRANCH"

          {
            echo
            echo "### Rebase Result"
            echo
            echo "main was rebased and pushed."
            echo
            echo "- previous main: \`$previous_sha\`"
            echo "- new main: \`$current_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
