name: rebase-sync-main-with-vscode

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-sync-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebase-sync-main:
    runs-on: ubuntu-24.04

    env:
      TARGET_BRANCH: sync-main
      UPSTREAM_REPOSITORY: https://github.com/microsoft/vscode.git
      UPSTREAM_BRANCH: main
      SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_EDITOR: true

    steps:
      - name: Validate sync token
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${SYNC_TOKEN:-}" ]; then
            exit 0
          fi

          {
            echo "## Missing Sync Token"
            echo
            echo "This workflow may need to update files under \`.github/workflows/\`."
            echo "GitHub's default \`GITHUB_TOKEN\` cannot reliably push those changes."
            echo
            echo "Create a repository secret named \`UPSTREAM_SYNC_TOKEN\` and use one of:"
            echo "- a fine-grained PAT with repository \`Contents: Read and write\` and \`Workflows: Read and write\`"
            echo "- a classic PAT with \`repo\` and \`workflow\` scopes"
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      - name: Checkout sync-main
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ env.SYNC_TOKEN }}

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git remote set-url origin "https://x-access-token:${{ env.SYNC_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Fetch upstream vscode
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH":refs/remotes/upstream/"$UPSTREAM_BRANCH"

      - name: Detect upstream changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          current_target_sha=$(git rev-parse HEAD)
          upstream_ref="refs/remotes/upstream/$UPSTREAM_BRANCH"
          upstream_sha=$(git rev-parse "$upstream_ref")
          merge_base=$(git merge-base HEAD "$upstream_ref")

          echo "current_target_sha=$current_target_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if [ "$merge_base" = "$upstream_sha" ]; then
            echo "needs_rebase=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Upstream Rebase"
              echo
              echo "No new upstream commits detected."
              echo
              echo "- $TARGET_BRANCH: \`$current_target_sha\`"
              echo "- upstream/$UPSTREAM_BRANCH: \`$upstream_sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "needs_rebase=true" >> "$GITHUB_OUTPUT"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          {
            echo "## Upstream Rebase"
            echo
            echo "New upstream commits detected. Rebase will start."
            echo
            echo "- $TARGET_BRANCH: \`$current_target_sha\`"
            echo "- merge-base: \`$merge_base\`"
            echo "- upstream/$UPSTREAM_BRANCH: \`$upstream_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebase sync-main onto upstream main
        if: steps.detect.outputs.needs_rebase == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! git rebase "refs/remotes/upstream/$UPSTREAM_BRANCH"; then
            git rebase --abort || true
            {
              echo
              echo "### Rebase Stopped"
              echo
              echo "Automatic rebase failed because of conflicts on \`$TARGET_BRANCH\`."
              echo "Resolve conflicts locally, then force-push the fixed \`$TARGET_BRANCH\` branch."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Push rebased sync-main
        if: steps.detect.outputs.needs_rebase == 'true'
        shell: bash
        run: |
          set -euo pipefail
          previous_sha="${{ steps.detect.outputs.current_target_sha }}"
          current_sha=$(git rev-parse HEAD)

          if [ "$previous_sha" = "$current_sha" ]; then
            {
              echo
              echo "### Rebase Result"
              echo
              echo "Rebase completed without changing the $TARGET_BRANCH branch head."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git push --force-with-lease origin HEAD:"$TARGET_BRANCH"

          {
            echo
            echo "### Rebase Result"
            echo
            echo "$TARGET_BRANCH was rebased and pushed."
            echo
            echo "- previous $TARGET_BRANCH: \`$previous_sha\`"
            echo "- new $TARGET_BRANCH: \`$current_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
